route = { pattern = "belles.nicholas.cloud", custom_domain = true }
kv_namespaces = [
  { binding="TRANSACTIONS", id="dcb32064b3f24d32b62261bd0c53a649" },
  { binding="WEBHOOK_SIGNING_KEYS", id="982d7142ae1c41ef92b5e42a746e9a83" },
